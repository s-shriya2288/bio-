<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSynth | Interactive Guide</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>

    <style>
        :root { --neon: #00f2ff; --pink: #ff00ff; --bg: #050608; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Layout */
        .wrapper { display: grid; grid-template-columns: 350px 1fr; height: 100vh; }
        
        /* Sidebar */
        .sidebar { 
            padding: 30px; background: rgba(255,255,255,0.03); 
            border-right: 1px solid rgba(0,242,255,0.2);
            display: flex; flex-direction: column; gap: 20px;
            backdrop-filter: blur(10px);
        }

        .info-card {
            background: rgba(0,0,0,0.5); border-left: 3px solid var(--neon);
            padding: 15px; margin-top: 20px; transition: 0.5s;
        }

        /* 3D Viewer */
        .viewer-container { position: relative; background: #000; }
        #mol-view { width: 100%; height: 100%; }

        /* Buttons */
        button {
            background: none; border: 1px solid var(--neon); color: var(--neon);
            padding: 12px; cursor: pointer; text-align: left; transition: 0.3s;
            font-size: 0.9rem; letter-spacing: 1px;
        }
        button:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }
        
        h2 { color: var(--neon); margin-bottom: 5px; }
        p { line-height: 1.6; font-size: 0.95rem; color: #ccc; }
    </style>
</head>
<body>

    <div class="wrapper">
        <aside class="sidebar">
            <h2>Micro-Lecturer</h2>
            <p>Select a visualization to understand how this protein is built.</p>
            
            <button onclick="explain('cartoon')">1. The Ribbon Path</button>
            <button onclick="explain('sphere')">2. Atomic Volume</button>
            <button onclick="explain('stick')">3. Chemical Bonds</button>
            <button onclick="explain('surface')">4. Molecular Skin</button>

            <div class="info-card" id="explainer-box">
                <b id="info-title" style="color:var(--neon)">Ready to Explore</b>
                <p id="info-text">Click a button to start the lesson. I will explain the physics and biology of what you see.</p>
            </div>

            <div style="margin-top:auto">
                <small>Current ID: <b id="id-display">4INS</b></small>
            </div>
        </aside>

        <main class="viewer-container">
            <div id="mol-view"></div>
        </main>
    </div>

    <script>
        let viewer;
        
        window.onload = function() {
            viewer = $3Dmol.createViewer(document.querySelector('#mol-view'), { backgroundColor: 'black' });
            loadProtein("4ins");
        };

        function loadProtein(pdbId) {
            viewer.clear();
            $3Dmol.download("pdb:" + pdbId, viewer, {}, function() {
                viewer.setStyle({}, {cartoon: {color: 'spectrum'}});
                viewer.zoomTo();
                viewer.render();
                viewer.spin(true);
            });
        }

        function explain(type) {
            const title = document.getElementById('info-title');
            const text = document.getElementById('info-text');

            if(type === 'cartoon') {
                viewer.setStyle({}, {cartoon: {color: 'spectrum'}});
                title.innerText = "The Ribbon Model";
                text.innerText = "This doesn't show atoms. It shows the 'backbone' path. The curls are Alpha-Helices (like springs) and the arrows are Beta-Sheets. This is how the protein folds to do its job.";
            } 
            else if(type === 'sphere') {
                viewer.setStyle({}, {sphere: {}});
                title.innerText = "Space-Filling Model";
                text.innerText = "This is what the protein actually 'looks' like to another molecule. Each sphere is an atom. It shows how crowded and solid the protein really is.";
            }
            else if(type === 'stick') {
                viewer.setStyle({}, {stick: {radius:0.2}});
                title.innerText = "The Skeletal View";
                text.innerText = "Here, we see the individual chemical bonds. Carbon is usually grey, Oxygen is red, and Nitrogen is blue. This is used by chemists to see how the 'parts' connect.";
            }
            else if(type === 'surface') {
                viewer.setStyle({}, {cartoon: {color: 'white'}});
                viewer.addSurface($3Dmol.SurfaceType.VDW, {opacity: 0.7, color: 'spectrum'});
                title.innerText = "Molecular Surface";
                text.innerText = "This shows the 'skin' of the protein. It helps scientists see 'pockets' where drugs or other molecules might dock, like a key fitting into a lock.";
            }
            viewer.render();
        }
    </script>
</body>
</html>
