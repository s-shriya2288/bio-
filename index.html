<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GENESIS | Molecular Intelligence Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(0, 20, 30, 0.85); --accent: #ff0055; }
        body { margin: 0; background: #020406; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; }
        
        /* Cinematic HUD Overlay */
        .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border: 20px solid transparent; box-sizing: border-box; border-image: radial-gradient(circle, transparent 70%, rgba(0,242,255,0.1) 100%) 30; z-index: 5; }
        
        .main-grid { display: grid; grid-template-columns: 350px 1fr 350px; height: 100vh; gap: 10px; padding: 10px; }
        
        .glass-panel { background: var(--glass); border: 1px solid rgba(0,242,255,0.2); border-radius: 4px; padding: 20px; pointer-events: all; backdrop-filter: blur(15px); display: flex; flex-direction: column; }
        
        #viewer { grid-column: 2; border-radius: 8px; border: 1px solid rgba(0,242,255,0.1); background: radial-gradient(circle, #0a0d14 0%, #000 100%); }

        /* Typography & Elements */
        h1 { font-size: 1.2rem; color: var(--neon); letter-spacing: 4px; margin: 0 0 20px 0; text-shadow: 0 0 10px var(--neon); }
        .stat-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.8rem; margin-bottom: 8px; color: #aaa; }
        .stat-val { color: var(--neon); }

        .control-btn { 
            background: rgba(0,242,255,0.1); border: 1px solid var(--neon); color: var(--neon); 
            padding: 12px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; 
            font-size: 0.7rem; transition: 0.3s; letter-spacing: 1px;
        }
        .control-btn:hover { background: var(--neon); color: black; font-weight: bold; }
        
        #console-log { flex-grow: 1; background: rgba(0,0,0,0.5); padding: 10px; font-family: monospace; font-size: 0.75rem; color: #0f0; overflow-y: auto; border: 1px solid #111; }

        /* Scanning Animation */
        .scanner { width: 100%; height: 2px; background: var(--neon); position: absolute; opacity: 0.5; animation: scanMove 3s infinite linear; }
        @keyframes scanMove { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body>

<div class="hud-layer"></div>

<div class="main-grid">
    <aside class="glass-panel">
        <h1>GENESIS_OS</h1>
        <div class="stat-row">SYSTEM: <span class="stat-val">ACTIVE</span></div>
        <div class="stat-row">MOLECULE: <span class="stat-val" id="mol-id">4INS</span></div>
        <div class="stat-row">RESIDUES: <span class="stat-val">51 AA</span></div>
        <hr style="border: 0.1px solid #222; margin: 15px 0;">
        
        <h3>VISUAL MODES</h3>
        <button class="control-btn" onclick="mode('cartoon')">Secondary Structure (Ribbon)</button>
        <button class="control-btn" onclick="mode('sphere')">Van der Waals (Atomic)</button>
        <button class="control-btn" onclick="mode('surface')">Molecular Envelope</button>
        <button class="control-btn" onclick="mode('stick')">Chemical Backbone</button>
        
        <div id="console-log">Initializing system...<br>> Core loaded.<br>> Ready for molecular injection.</div>
    </aside>

    <div id="viewer">
        <div class="scanner"></div>
    </div>

    <aside class="glass-panel">
        <h3>SEQUENCE ANALYSIS</h3>
        <p style="font-size: 0.8rem; line-height: 1.4; color: #ccc;">
            Proteins are biological machines. Their 3D shape determines their function in the body.
        </p>
        
        <button class="control-btn" style="border-color: var(--accent); color: var(--accent);" onclick="toggleSpin()">HALT ROTATION</button>
        <button class="control-btn" onclick="zoomIn()">FOCUS ACTIVE SITE</button>
        
        <div class="stat-row" style="margin-top:20px;">X-RAY DIFFRACTION: <span class="stat-val">ENABLED</span></div>
        <input type="range" min="0" max="100" value="100" oninput="adjustOpacity(this.value)" style="width:100%;">
        <label style="font-size: 0.6rem;">STRUCTURE OPACITY</label>

        <div style="margin-top:auto">
            <input type="text" id="pdbInput" placeholder="ENTER PDB CODE" style="width:100%; background: #000; border: 1px solid var(--neon); color: white; padding: 10px; box-sizing: border-box;">
            <button class="control-btn" style="width:100%; margin-top:5px;" onclick="fetchNew()">EXECUTE FETCH</button>
        </div>
    </aside>
</div>

<script>
    let viewer;
    let spinning = true;

    window.onload = function() {
        viewer = $3Dmol.createViewer(document.getElementById('viewer'), { backgroundColor: 'black' });
        loadMolecule("4ins"); // Starts with Insulin
    };

    function loadMolecule(id) {
        log(`> Requesting data for ${id}...`);
        viewer.clear();
        $3Dmol.download("pdb:" + id, viewer, {}, function() {
            viewer.setStyle({}, {cartoon: {color: 'spectrum'}});
            viewer.zoomTo();
            viewer.render();
            viewer.spin(true);
            document.getElementById('mol-id').innerText = id.toUpperCase();
            log(`> Data stream stabilized.`);
            log(`> Analysis: Tertiary folding complete.`);
        });
    }

    function mode(m) {
        viewer.removeAllSurfaces();
        if(m === 'cartoon') viewer.setStyle({}, {cartoon: {color: 'spectrum'}});
        if(m === 'sphere') viewer.setStyle({}, {sphere: {}});
        if(m === 'surface') {
            viewer.setStyle({}, {cartoon: {color: 'white'}});
            viewer.addSurface($3Dmol.SurfaceType.VDW, {opacity: 0.6, color: 'cyan'});
        }
        if(m === 'stick') viewer.setStyle({}, {stick: {radius: 0.2}});
        viewer.render();
        log(`> Visual Mode: ${m.toUpperCase()} activated.`);
    }

    function log(msg) {
        const c = document.getElementById('console-log');
        c.innerHTML += `<br>${msg}`;
        c.scrollTop = c.scrollHeight;
    }

    function toggleSpin() {
        spinning = !spinning;
        viewer.spin(spinning);
        log(`> Rotation: ${spinning ? 'ON' : 'LOCKED'}`);
    }

    function adjustOpacity(v) {
        viewer.setStyle({}, {cartoon: {opacity: v/100, color: 'spectrum'}});
        viewer.render();
    }

    function fetchNew() {
        let val = document.getElementById('pdbInput').value;
        if(val.length === 4) loadMolecule(val);
        else alert("PDB IDs must be 4 characters.");
    }

    function zoomIn() {
        viewer.zoom(2, 1000); // Smooth zoom factor 2 over 1 second
        log("> Focusing on high-density atomic region.");
    }
</script>
</body>
</html>
