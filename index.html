<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Visualizer Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://3dmol.org/build/3Dmol-min.js"></script>
</head>
<body>
    <header>
        <h1>Microscopic Protein Explorer</h1>
        <p>Real-time 3D structure visualization</p>
    </header>

    <main>
        <div id="container-01" class="mol-container"></div>
        
        <div class="controls">
            <button onclick="changeStyle('stick')">Stick View</button>
            <button onclick="changeStyle('sphere')">Space Fill</button>
            <button onclick="changeStyle('cartoon')">Cartoon (Ribbon)</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
