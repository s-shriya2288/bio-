<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSynth | Advanced Molecular Console</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>

    <style>
        :root { 
            --neon: #00f2ff; --magenta: #ff00ff; --warning: #ffcc00; 
            --panel: rgba(10, 12, 18, 0.95); --border: rgba(0, 242, 255, 0.3);
        }
        
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; 
        }

        /* The Grid Overlay */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.1; pointer-events: none;
        }

        .main-interface {
            display: grid; grid-template-columns: 320px 1fr 300px;
            height: 100vh; position: relative; z-index: 1;
        }

        .panel { 
            background: var(--panel); border: 1px solid var(--border); 
            margin: 10px; padding: 20px; border-radius: 8px;
            display: flex; flex-direction: column; gap: 15px;
            backdrop-filter: blur(10px);
        }

        h3 { color: var(--neon); text-transform: uppercase; font-size: 0.9rem; margin: 0; border-bottom: 1px solid var(--border); padding-bottom: 5px;}

        /* Controls */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button {
            background: rgba(0, 242, 255, 0.05); border: 1px solid var(--neon);
            color: var(--neon); padding: 8px; cursor: pointer; font-size: 0.75rem;
            transition: 0.2s; border-radius: 4px;
        }
        button:hover { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); }
        
        .special-btn { border-color: var(--magenta); color: var(--magenta); }
        .special-btn:hover { background: var(--magenta); color: #fff; box-shadow: 0 0 10px var(--magenta); }

        #viewer { width: 100%; height: 100%; cursor: crosshair; }

        /* Data Readout */
        .readout { font-family: monospace; font-size: 0.8rem; color: #888; background: #111; padding: 10px; border-radius: 4px; }
        .active-id { color: var(--warning); font-size: 1.2rem; }

    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="main-interface">
        <aside class="panel">
            <h3>Structure Control</h3>
            <div class="readout">
                TARGET ID: <span class="active-id" id="id-tag">4INS</span><br>
                STATUS: <span id="status">ANALYZING...</span>
            </div>
            
            <div class="btn-grid">
                <button onclick="setView('cartoon')">Ribbon</button>
                <button onclick="setView('sphere')">Atomic</button>
                <button onclick="setView('stick')">Chemical</button>
                <button onclick="setView('surface')">Surface</button>
            </div>

            <h3>Advanced Filters</h3>
            <button class="special-btn" onclick="toggleGhost()">Ghost Mode (X-Ray)</button>
            <button class="special-btn" onclick="highlightHydrogens()">Isolate Chains</button>
            
            <div style="margin-top:auto">
                <input type="text" id="pdbInput" placeholder="Enter PDB ID..." style="width:70%; background:#111; border:1px solid #333; color:white; padding:5px;">
                <button onclick="loadNew()">FETCH</button>
            </div>
        </aside>

        <div id="viewer"></div>

        <aside class="panel">
            <h3>Molecular Intelligence</h3>
            <div id="info-text" class="readout" style="height: 150px; overflow-y: auto;">
                Initializing sequence analysis... <br>
                Click 'Ribbon' to see secondary structure fold patterns.
            </div>
            
            <h3>Environmental</h3>
            <button onclick="toggleSpin()">Freeze/Rotate</button>
            <button onclick="viewer.zoomTo()">Recenter Axis</button>
            
            <div class="readout" style="color: var(--neon); margin-top: auto;">
                SYS_VER: 3.0.4<br>
                RENDER_ENGINE: 3Dmol.js<br>
                COORD_TYPE: PDB_DATA
            </div>
        </aside>
    </div>

    <script>
        let viewer;
        let isSpinning = true;
        let isGhost = false;

        window.onload = function() {
            viewer = $3Dmol.createViewer(document.getElementById('viewer'), { backgroundColor: 'black' });
            loadProtein("4ins"); // Insulin
        };

        function loadProtein(id) {
            document.getElementById('status').innerText = "DOWNLOADING...";
            viewer.clear();
            $3Dmol.download("pdb:" + id, viewer, {}, function() {
                document.getElementById('id-tag').innerText = id.toUpperCase();
                document.getElementById('status').innerText = "LIVE";
                viewer.setStyle({}, {cartoon: {color: 'spectrum'}});
                viewer.zoomTo();
                viewer.render();
                viewer.spin(true);
            });
        }

        function setView(style) {
            viewer.removeAllSurfaces();
            viewer.removeAllShapes();
            
            if(style === 'cartoon') viewer.setStyle({}, {cartoon: {color: 'spectrum'}});
            if(style === 'sphere') viewer.setStyle({}, {sphere: {scale: 0.3}, stick:{radius:0.1}});
            if(style === 'stick') viewer.setStyle({}, {stick: {colorscheme: 'amino acid'}});
            if(style === 'surface') {
                viewer.setStyle({}, {cartoon: {color: 'white'}});
                viewer.addSurface($3Dmol.SurfaceType.VDW, {opacity: 0.8, colorscheme: 'spectrum'});
            }
            viewer.render();
            updateIntelligence(style);
        }

        function toggleGhost() {
            isGhost = !isGhost;
            if(isGhost) {
                viewer.setStyle({}, {cartoon: {opacity: 0.2}, sphere: {opacity: 0.1}});
            } else {
                viewer.setStyle({}, {cartoon: {opacity: 1}});
            }
            viewer.render();
        }

        function highlightHydrogens() {
            // Color each chain differently to see multi-part proteins
            viewer.setStyle({}, {cartoon: {colorfunc: (atom) => atom.chain === 'A' ? 'cyan' : 'magenta'}});
            viewer.render();
            document.getElementById('info-text').innerHTML += "<br>> Multi-chain separation applied.";
        }

        function updateIntelligence(style) {
            const logs = {
                cartoon: "Mapping secondary structure: Alpha-helices (coils) and Beta-sheets identified.",
                sphere: "Surface area calculated. Van der Waals radii rendered.",
                stick: "Covalent bonds active. Amino acid sequence color-coded.",
                surface: "Hydrophobic/Hydrophilic envelope generated."
            };
            document.getElementById('info-text').innerHTML += `<br>> ${logs[style]}`;
        }

        function loadNew() {
            let id = document.getElementById('pdbInput').value;
            if(id) loadProtein(id);
        }

        function toggleSpin() {
            isSpinning = !isSpinning;
            viewer.spin(isSpinning);
        }
    </script>
</body>
</html>
